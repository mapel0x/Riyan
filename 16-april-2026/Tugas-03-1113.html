<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar di Amikom</title>
    <link rel="stylesheet" href="Tugas-03-1113.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="left-side">
            <img src="slider-1.png" alt="Amikom Students">
        </div>
        <div class="right-side">
            <h2>Daftar di Amikom</h2>

            <div class="form-card">
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="Nama lengkap">
                    </div>
                    <div class="input-group">
                        <input type="text" placeholder="Email/nomor HP">
                    </div>
                    <div class="input-group password-group">
                        <input type="password" placeholder="Kata sandi">
                        <i class="fas fa-eye eye-icon"></i>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="syarat">
                        <label for="syarat">Dengan mencentang ini, kamu menyetujui <a href="#">Syarat & Ketentuan</a>
                            kami.</label>
                    </div>
                    <button type="button" class="btn-daftar">Daftar</button>
                </form>
            </div>

            <div class="social-login">
                <button class="btn-facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
                <button class="btn-google"><img
                        src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="G"
                        style="width: 18px;"> Google</button>
            </div>

            <p class="login-link">Sudah terdaftar? <a href="#">Masuk</a></p>
        </div>
    </div>
</body>

</html>
