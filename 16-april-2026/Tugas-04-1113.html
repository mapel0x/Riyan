<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="Tugas-04-1113 .css">
</head>

<body>
    <div class="container">
        <h1>Register</h1>
        <div class="form-wrapper">
            <form action="#">
                <div class="row name-row">
                    <input type="text" placeholder="Firstname" class="input-field">
                    <input type="text" placeholder="Middlename" class="input-field">
                    <input type="text" placeholder="Lastname" class="input-field">
                </div>
                <div class="row">
                    <input type="text" placeholder="Username [alphanumeric min 6 chars]" class="input-field">
                </div>
                <div class="row">
                    <input type="email" placeholder="Email" class="input-field">
                </div>

                <button type="submit" class="submit-btn">SIGNUP</button>
            </form>
            <div class="links">
                <a href="#">Have already an account? Login Now!</a><br>
                <a href="#">Forgot your password? Click Here!</a>
            </div>
        </div>
    </div>
</body>

</html>
